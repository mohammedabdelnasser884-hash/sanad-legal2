name: Supabase Keep-Alive

# بيمنع Supabase من إيقاف مشروع الـFree Plan بسبب عدم النشاط (7 أيام).
# بيبعت طلب SELECT حقيقي وخفيف جدًا على جدول tenants كل 3 أيام —
# هامش أمان كافي تحت سقف الـ7 أيام، من غير ما يستهلك من أي حصة (quota).

on:
  schedule:
    # كل 3 أيام الساعة 3 صباحًا UTC (تقريبًا 5 أو 6 صباحًا بتوقيت مصر
    # حسب التوقيت الصيفي/الشتوي)
    - cron: '0 3 */3 * *'
  workflow_dispatch: {} # يسمح بتشغيله يدويًا من تبويب Actions للتجربة

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (SELECT خفيف على tenants)
        run: |
          set -e
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/tenants?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP status: $HTTP_STATUS"
          cat /tmp/response.json

          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "::error::فشل طلب keep-alive — راجع الـsecrets أو حالة المشروع على Supabase"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
